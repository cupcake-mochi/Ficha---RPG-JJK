name: Preparação de nuvem B47
on:
  push:
    branches: ['codex/**', 'claude/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bash nuvem-b47/preparar.sh
      # Os testes salariais comparam o fonte atual com duas bases imutáveis.
      # O checkout raso padrão não contém esses objetos; não pular as comparações.
      - name: Buscar bases dos testes salariais
        run: |
          git fetch --no-tags --depth=1 origin \
            9536746405f12a9e159e9173b54a2a861c0a871a \
            57117fbe5c2361e6a09bfa00f037b4bcfaa8437f
      - run: .venv/bin/python nuvem-b47/conferir.py --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-nuvem
          path: nuvem-b47/saidas/

name: Preparação de nuvem B47
on:
  push:
    branches: ['codex/**', 'claude/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bash nuvem-b47/preparar.sh
      - run: .venv/bin/python nuvem-b47/conferir.py --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-nuvem
          path: nuvem-b47/saidas/
